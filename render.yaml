services:
  - type: web
    name: kefir-system
    runtime: docker
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Kefir System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: kefir-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: kefir-db
    plan: basic-256mb
    databaseName: kefir
    user: kefir
